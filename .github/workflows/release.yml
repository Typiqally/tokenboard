name: Release

on:
  push:
    tags:
      - "v[0-9]*"

permissions:
  contents: write

env:
  DEVELOPER_DIR: /Applications/Xcode_16.0.app/Contents/Developer

jobs:
  release:
    runs-on: macos-15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Run tests
        run: swift test
      - name: Package universal app
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: Scripts/package-release.sh "${RELEASE_TAG#v}" .build/artifacts
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          version=${RELEASE_TAG#v}
          archive=".build/artifacts/Tokenboard-$version.zip"
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "$archive" --clobber
          else
            gh release create "$RELEASE_TAG" "$archive" \
              --title "Tokenboard $version" \
              --generate-notes \
              --verify-tag
          fi
