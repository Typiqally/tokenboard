name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: macos-15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Run tests
        run: swift test
      - name: Build release app
        run: Scripts/build-app.sh release
      - name: Verify signed bundle
        run: Scripts/verify-entitlements.sh .build/release/Tokenboard.app
      - name: Check patch whitespace
        run: git diff --check
