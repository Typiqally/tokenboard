name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer

jobs:
  build-and-test:
    runs-on: macos-15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Run tests
        run: swift test
      - name: Run import resource benchmark
        run: Scripts/benchmark-import.sh
      - name: Verify companion asset inventory
        run: Scripts/verify-asset-rights.sh development
      - name: Verify tooling contracts
        run: Scripts/test-tooling-contracts.sh
      - name: Build release app
        run: Scripts/build-app.sh release universal
      - name: Verify signed bundle
        run: Scripts/verify-entitlements.sh .build/release/Tokenboard.app
      - name: Verify idle runtime resources
        run: Scripts/verify-runtime-resources.sh .build/release/Tokenboard.app
      - name: Check patch whitespace
        env:
          GITHUB_EVENT_BEFORE: ${{ github.event.before }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_BASE_REF: ${{ github.base_ref }}
        run: Scripts/ci-diff-check.sh
