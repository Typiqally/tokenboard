      <rect x="720" y="22" width="438" height="436" rx="24" fill="url(#desktop)" stroke="#fff" stroke-opacity=".13"/>
      <rect x="738" y="39" width="402" height="38" rx="11" fill="#10141a" fill-opacity=".74" stroke="#fff" stroke-opacity=".08"/>
      <circle cx="759" cy="58" r="3" fill="#7d8898"/>
      <circle cx="772" cy="58" r="3" fill="#7d8898" opacity=".6"/>
