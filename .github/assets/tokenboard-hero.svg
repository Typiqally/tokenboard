          </g>
          <path d="M113 491v27M216 491v27M20 524H330" stroke="#fff" stroke-opacity=".14"/>

          <rect x="20" y="533" width="34" height="34" rx="9" fill="#c95d39"/>
          <text x="37" y="556" text-anchor="middle" fill="#fff" font-size="16">✦</text>
          <text x="65" y="556" fill="#f0f1f2" font-size="13.5" font-weight="650">Claude Code</text>
          <rect x="167" y="547" width="87" height="7" rx="3.5" fill="#333538"/><rect x="167" y="547" width="56" height="7" rx="3.5" fill="#838589"/>
          <text x="301" y="557" text-anchor="end" fill="#ededee" font-size="13.5" font-weight="650">64%</text><text x="330" y="557" text-anchor="end" fill="#76797d" font-size="18">›</text>

          <rect x="20" y="575" width="34" height="34" rx="9" fill="#070809" stroke="#fff" stroke-opacity=".1"/>
          <circle cx="37" cy="592" r="9" fill="none" stroke="#fff" stroke-width="1.3"/>
          <text x="65" y="598" fill="#f0f1f2" font-size="13.5" font-weight="650">Codex</text>
          <rect x="167" y="589" width="87" height="7" rx="3.5" fill="#333538"/><rect x="167" y="589" width="31" height="7" rx="3.5" fill="#838589"/>
          <text x="301" y="599" text-anchor="end" fill="#ededee" font-size="13.5" font-weight="650">36%</text><text x="330" y="599" text-anchor="end" fill="#76797d" font-size="18">›</text>

          <path d="M0 617H350" stroke="#fff" stroke-opacity=".17"/>
          <text x="20" y="645" fill="#e3e5e7" font-size="12.5">◷  History</text>
          <text x="330" y="645" text-anchor="end" fill="#e3e5e7" font-size="12.5">⚙  Settings</text>
