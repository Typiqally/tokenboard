    <text x="83" y="82" fill="#9fb1c5" font-size="13" font-weight="700" letter-spacing="2.1">TOKENBOARD FOR MACOS</text>

    <text x="64" y="151" fill="#f6f8fa" font-size="49" font-weight="710" letter-spacing="-2">Your local AI usage.</text>
    <text x="64" y="205" fill="#f6f8fa" font-size="49" font-weight="710" letter-spacing="-2">One glance away.</text>

    <text x="64" y="252" fill="#b6c0cd" font-size="18">Exact Claude Code and Codex token totals,</text>
    <text x="64" y="279" fill="#b6c0cd" font-size="18">private on your Mac.</text>

    <g font-size="13" font-weight="620" fill="#dce2ea">
      <rect x="64" y="325" width="117" height="34" rx="17" fill="#fff" fill-opacity=".07" stroke="#fff" stroke-opacity=".12"/>
      <circle cx="83" cy="342" r="4" fill="#88a9c4"/>
      <text x="95" y="347">Native macOS</text>
      <rect x="191" y="325" width="102" height="34" rx="17" fill="#fff" fill-opacity=".07" stroke="#fff" stroke-opacity=".12"/>
      <circle cx="210" cy="342" r="4" fill="#7fba9c"/>
      <text x="222" y="347">Local only</text>
      <rect x="303" y="325" width="121" height="34" rx="17" fill="#fff" fill-opacity=".07" stroke="#fff" stroke-opacity=".12"/>
      <circle cx="322" cy="342" r="4" fill="#b899d1"/>
      <text x="334" y="347">No telemetry</text>
    </g>

    <text x="64" y="420" fill="#7e8999" font-size="12" font-weight="550" letter-spacing=".35">MENU BAR · EVENT-DRIVEN · CONTENT-SAFE AGGREGATES</text>

