          <text x="20" y="67" fill="#fff" font-size="29" font-weight="690" letter-spacing="-1">715,836,366 tokens</text>
          <text x="20" y="91" fill="#e5e9ea" font-size="13.5" font-weight="550">≈ $474.26 API equivalent</text>
          <rect y="221" width="218" height="3" fill="#f3f4f5"/>
          <rect x="218" y="221" width="132" height="3" fill="#090b0d" opacity=".55"/>

          <rect y="224" width="350" height="432" fill="#1b1c1e"/>
          <rect x="20" y="236" width="310" height="24" rx="6" fill="#343436"/>
          <rect x="20" y="236" width="78" height="24" rx="6" fill="#2f7ff2"/>
          <path d="M98 241v14M175 241v14M253 241v14" stroke="#fff" stroke-opacity=".18"/>
