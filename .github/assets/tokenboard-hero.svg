            <path d="M38 114l36-29 38 29z" fill="#855646"/>
            <rect x="70" y="133" width="12" height="26" fill="#624536"/>
            <rect x="255" y="102" width="65" height="53" rx="2" fill="#d7c08a"/>
            <path d="M246 105l41-32 42 32z" fill="#8c5947"/>
            <rect x="282" y="128" width="13" height="27" fill="#654636"/>
