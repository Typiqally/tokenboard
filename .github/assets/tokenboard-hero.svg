<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="480" viewBox="0 0 1200 480" role="img" aria-labelledby="title desc">
  <title id="title">Tokenboard for macOS</title>
  <desc id="desc">A product banner for Tokenboard showing the current companion popover with its panorama, trend chart, Work Patterns preview, provider shares, and footer.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#11151b"/>
      <stop offset=".56" stop-color="#1b222b"/>
      <stop offset="1" stop-color="#0d1117"/>
    </linearGradient>
    <radialGradient id="glow" cx="0" cy="0" r="1" gradientTransform="translate(925 175) rotate(140) scale(410 300)">
      <stop stop-color="#70a5b2" stop-opacity=".24"/>
      <stop offset=".58" stop-color="#465a75" stop-opacity=".08"/>
      <stop offset="1" stop-color="#11151b" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="desktop" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#343c48"/>
      <stop offset="1" stop-color="#202630"/>
    </linearGradient>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#6bb2c6"/>
      <stop offset=".65" stop-color="#b8d0b9"/>
      <stop offset="1" stop-color="#e2d09c"/>
    </linearGradient>
    <linearGradient id="hill" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#648c57"/>
      <stop offset="1" stop-color="#34553a"/>
    </linearGradient>
    <linearGradient id="scrim" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#071015" stop-opacity=".9"/>
      <stop offset=".48" stop-color="#071015" stop-opacity=".3"/>
      <stop offset="1" stop-color="#071015" stop-opacity="0"/>
    </linearGradient>
    <filter id="shadow" x="-25%" y="-20%" width="150%" height="160%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#000" flood-opacity=".48"/>
    </filter>
    <clipPath id="miniClip">
      <rect width="350" height="656" rx="22"/>
    </clipPath>
  </defs>

  <rect width="1200" height="480" rx="26" fill="url(#background)"/>
  <rect width="1200" height="480" rx="26" fill="url(#glow)"/>

  <g font-family="-apple-system,BlinkMacSystemFont,'SF Pro Display','Helvetica Neue',Arial,sans-serif">
